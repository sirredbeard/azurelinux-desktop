name: Release

# One publication path. Schedule does the full set. Manual dispatch is
# the same workflow with per-artifact flags, so a focused rebuild does
# not mean a second workflow file or a second mental model.
#
# Graph:
#   plan
#     -> cleanup (only when replacing the release)
#     -> create-release (when any GitHub Release asset is in scope)
#     -> kmods (optional; Pages repo, kernel drift)
#     -> build-live and build-installer after kmods + create-release
#        (release_tag passed in; each product uploads as that job ends)
#     -> containers.yml tool-images on schedule (or manual kmods=true).
#        Focused manual ISO/VM skips tool-images and kmods; jobs pull
#        existing GHCR tags. Optional canary: schedule always rebuilds;
#        manual default off (7-day skip if turned on).
#     -> finalize (notes only; no second asset upload)
#
# Concurrency and failure isolation:
# - Live ISO, installer ISO, and qcow2 build at the same time (installer
#   is its own reusable call; live ISO and qcow2 are parallel jobs inside
#   build-live-iso.yml).
# - Each finished ISO/qcow2/7z is hashed, split, and attached to the
#   release inside the build job (scripts/ci-upload-release-asset.sh).
#   No parent upload-* jobs - avoids waiting on the whole reusable call
#   and avoids double upload.
# - qcow2 stays an Actions artifact so VHDX/VDI/VMDK can download it.
#   Convert formats go to the release only (no Actions artifact when
#   release_tag is set).
# - containers.yml owns GHCR canary + build-lorax/kiwi/kmods images.
#   Canary failure must not block image builds. Image failure must not
#   block canary. Live ISO failure must not block qcow2/VM jobs when
#   the disk build still produced artifacts (continue-on-error inside
#   the reusable workflows).
# - Package lists, build logs, and vendor snapshots stay in the reusable
#   build workflows. Do not strip those when editing this file.
#
# Internals (not dispatched by hand):
#   build-live-iso.yml, build-installer-iso.yml, publish-desktop-kmods.yml,
#   containers.yml (also weekly schedule of its own)
#
# Release rules:
# - One GitHub Release is the product. Get-AzureLinuxDesktop.ps1 reads
#   /releases/latest.
# - Schedule, or manual replace_release: delete every prior release and
#   tag, mint a UTC-date tag, apply .github/release-notes-template.md.
# - Focused manual (replace_release off): scripts/resolve-release-tag.sh
#   attaches to the current release and clobbers only the assets this run
#   built. Do not mint a second tag just because UTC rolled over.
# - Split every oversize asset with split -b 1900M so we stay under the
#   GitHub 2GiB per-asset cap.

on:
  schedule:
    - cron: "30 05 * * *"
  workflow_dispatch:
    inputs:
      live_iso:
        description: "Build and publish the live desktop ISO"
        type: boolean
        default: true
      installer_iso:
        description: "Build and publish the installer ISO"
        type: boolean
        default: true
      qcow2:
        description: "Build and publish the qcow2 disk image (also the source for VHDX/VDI/VMDK when those are on)"
        type: boolean
        default: true
      vhdx:
        description: "Build and publish the VHDX disk image (Hyper-V, 7z)"
        type: boolean
        default: true
      vdi:
        description: "Build and publish the VDI disk image (VirtualBox, 7z)"
        type: boolean
        default: true
      vmdk:
        description: "Build and publish the VMDK disk image (VMware, 7z)"
        type: boolean
        default: true
      canary:
        description: "Canary container lifecycle (containers.yml). Off by default on manual runs — use when you want a canary rebuild/test. Schedule always builds and tests it."
        type: boolean
        default: false
      kmods:
        description: "Kernel drift check + kmod Pages publish. Off by default on manual focused ISO/VM runs. Schedule always runs it."
        type: boolean
        default: false
      replace_release:
        description: "Delete every prior GitHub release/tag and mint a fresh dated release with the notes template. Schedule always does this. Leave off to clobber assets on the current release only."
        type: boolean
        default: false
      upload_actions_artifacts:
        description: "Also upload multi-GB product images as Actions artifacts. Default off — release assets still publish. qcow2 still uploads as an artifact when any of VHDX/VDI/VMDK is on (convert jobs need it)."
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

# One group per product set so a focused installer rebuild does not wait
# behind live/qcow (and vice versa). Schedule always uses "full". Two
# dispatches that touch the same product still serialize.
concurrency:
  group: >-
    azurelinux-desktop-pub-${{
      github.event_name == 'schedule' && 'full' ||
      format('L{0}-I{1}-Q{2}-H{3}-D{4}-M{5}-C{6}-K{7}',
        inputs.live_iso && '1' || '0',
        inputs.installer_iso && '1' || '0',
        inputs.qcow2 && '1' || '0',
        inputs.vhdx && '1' || '0',
        inputs.vdi && '1' || '0',
        inputs.vmdk && '1' || '0',
        inputs.canary && '1' || '0',
        inputs.kmods && '1' || '0')
    }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ${{ vars.AZL_RUNNER_LIGHT || 'ubuntu-24.04' }}
    outputs:
      live_iso: ${{ steps.flags.outputs.live_iso }}
      installer_iso: ${{ steps.flags.outputs.installer_iso }}
      qcow2: ${{ steps.flags.outputs.qcow2 }}
      vhdx: ${{ steps.flags.outputs.vhdx }}
      vdi: ${{ steps.flags.outputs.vdi }}
      vmdk: ${{ steps.flags.outputs.vmdk }}
      canary: ${{ steps.flags.outputs.canary }}
      force_canary: ${{ steps.flags.outputs.force_canary }}
      kmods: ${{ steps.flags.outputs.kmods }}
      replace_release: ${{ steps.flags.outputs.replace_release }}
      build_disk_image: ${{ steps.flags.outputs.build_disk_image }}
      need_github_release: ${{ steps.flags.outputs.need_github_release }}
      need_live_build: ${{ steps.flags.outputs.need_live_build }}
      tool_targets: ${{ steps.flags.outputs.tool_targets }}
      need_tool_images: ${{ steps.flags.outputs.need_tool_images }}
      upload_actions_artifacts: ${{ steps.flags.outputs.upload_actions_artifacts }}
    steps:
      - id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_LIVE: ${{ inputs.live_iso }}
          IN_INSTALLER: ${{ inputs.installer_iso }}
          IN_QCOW2: ${{ inputs.qcow2 }}
          IN_VHDX: ${{ inputs.vhdx }}
          IN_VDI: ${{ inputs.vdi }}
          IN_VMDK: ${{ inputs.vmdk }}
          IN_CANARY: ${{ inputs.canary }}
          IN_KMODS: ${{ inputs.kmods }}
          IN_REPLACE: ${{ inputs.replace_release }}
          IN_UPLOAD_ARTIFACTS: ${{ inputs.upload_actions_artifacts }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            live=true; installer=true; qcow2=true; vhdx=true
            vdi=true; vmdk=true; canary=true; kmods=true; replace=true
            # Nightly always rebuilds canary. Focused manual ISO/qcow runs
            # leave canary off (default false) and never force a rebuild.
            force_canary=true
            # Schedule publishes to the release; skip multi-GB Actions
            # product artifacts (qcow still uploads when VM converts run).
            upload_artifacts=false
          else
            live="${IN_LIVE:-false}"
            installer="${IN_INSTALLER:-false}"
            qcow2="${IN_QCOW2:-false}"
            vhdx="${IN_VHDX:-false}"
            vdi="${IN_VDI:-false}"
            vmdk="${IN_VMDK:-false}"
            canary="${IN_CANARY:-false}"
            kmods="${IN_KMODS:-false}"
            replace="${IN_REPLACE:-false}"
            upload_artifacts="${IN_UPLOAD_ARTIFACTS:-false}"
            # Manual: honor canary flag but use 7-day skip inside containers.yml
            force_canary=false
          fi
          disk=false
          if [ "$qcow2" = "true" ] || [ "$vhdx" = "true" ] || [ "$vdi" = "true" ] || [ "$vmdk" = "true" ]; then
            disk=true
          fi
          need_live=false
          if [ "$live" = "true" ] || [ "$disk" = "true" ]; then
            need_live=true
          fi
          need_rel=false
          if [ "$live" = "true" ] || [ "$installer" = "true" ] || [ "$disk" = "true" ]; then
            need_rel=true
          fi
          # Tool images vs canary are separate containers.yml calls so a
          # long canary build never blocks kmods or ISO jobs.
          #
          # Schedule (routine): ensure lorax/kiwi/kmods images and kmods.
          # Focused manual ISO/VM: skip tool-images and kmods by default —
          # jobs pull existing GHCR tags; weekly containers + nightly
          # schedule keep them fresh. Turn kmods on only when you want a
          # drift check on a manual run.
          tools=()
          need_tool_images=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$need_live" = "true" ] || [ "$installer" = "true" ]; then
              tools+=(lorax)
              tools+=(kiwi)
            fi
            if [ "$kmods" = "true" ] || [ "$need_live" = "true" ] || [ "$installer" = "true" ]; then
              tools+=(kmods)
            fi
          elif [ "$kmods" = "true" ]; then
            # Manual kmods-only or kmods+ISO: still ensure build-kmods image.
            tools+=(kmods)
          fi
          if [ "${#tools[@]}" -eq 0 ]; then
            tool_targets=none
            need_tool_images=false
          else
            IFS=,; tool_targets="${tools[*]}"; unset IFS
            need_tool_images=true
          fi
          {
            echo "live_iso=$live"
            echo "installer_iso=$installer"
            echo "qcow2=$qcow2"
            echo "vhdx=$vhdx"
            echo "vdi=$vdi"
            echo "vmdk=$vmdk"
            echo "canary=$canary"
            echo "force_canary=$force_canary"
            echo "kmods=$kmods"
            echo "replace_release=$replace"
            echo "build_disk_image=$disk"
            echo "need_live_build=$need_live"
            echo "need_github_release=$need_rel"
            echo "tool_targets=$tool_targets"
            echo "need_tool_images=$need_tool_images"
            echo "upload_actions_artifacts=$upload_artifacts"
          } >> "$GITHUB_OUTPUT"
          echo "plan: live=$live installer=$installer qcow2=$qcow2 vhdx=$vhdx vdi=$vdi vmdk=$vmdk canary=$canary force_canary=$force_canary kmods=$kmods replace=$replace tools=$tool_targets need_tool_images=$need_tool_images upload_artifacts=$upload_artifacts"

  cleanup:
    needs: plan
    if: needs.plan.outputs.replace_release == 'true'
    runs-on: ${{ vars.AZL_RUNNER_LIGHT || 'ubuntu-24.04' }}
    steps:
      - name: Check out all tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete previous GitHub releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "${{ github.repository }}" --limit 1000 \
            --json tagName --jq '.[].tagName' |
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              gh release delete "$tag" --repo "${{ github.repository }}" --yes
            done
          git ls-remote --tags --refs origin |
            awk '{sub("refs/tags/", "", $2); print $2}' |
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              git push origin --delete "refs/tags/$tag"
            done

  create-release:
    needs: [plan, cleanup]
    if: |
      always()
      && needs.plan.outputs.need_github_release == 'true'
      && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    runs-on: ${{ vars.AZL_RUNNER_LIGHT || 'ubuntu-24.04' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve or choose release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ needs.plan.outputs.replace_release }}
        run: |
          set -euo pipefail
          if [ "$REPLACE" = "true" ]; then
            echo "tag=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/resolve-release-tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Create release with notes template
        if: steps.tag.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Azure Linux Desktop ${{ steps.tag.outputs.tag }}
          body_path: .github/release-notes-template.md
          make_latest: true

  kmods:
    needs: [plan, cleanup, tool-images]
    if: |
      always()
      && needs.plan.outputs.kmods == 'true'
      && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
      && (needs.tool-images.result == 'success' || needs.tool-images.result == 'skipped')
    uses: ./.github/workflows/publish-desktop-kmods.yml

  # Builds wait on create-release so release_tag exists before the first
  # product finishes. Upload is in-job inside the reusable workflows.
  build-live:
    needs: [plan, kmods, create-release, tool-images]
    if: |
      always()
      && needs.plan.outputs.need_live_build == 'true'
      && (needs.kmods.result == 'success' || needs.kmods.result == 'skipped')
      && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
      && (needs.tool-images.result == 'success' || needs.tool-images.result == 'skipped')
    uses: ./.github/workflows/build-live-iso.yml
    with:
      build_iso: ${{ needs.plan.outputs.live_iso == 'true' }}
      build_disk_image: ${{ needs.plan.outputs.build_disk_image == 'true' }}
      build_vhdx: ${{ needs.plan.outputs.vhdx == 'true' }}
      build_vdi: ${{ needs.plan.outputs.vdi == 'true' }}
      build_vmdk: ${{ needs.plan.outputs.vmdk == 'true' }}
      prepare_kernel_modules: false
      release_tag: ${{ needs.create-release.outputs.tag }}
      upload_actions_artifacts: ${{ needs.plan.outputs.upload_actions_artifacts == 'true' }}

  build-installer:
    needs: [plan, kmods, create-release, tool-images]
    if: |
      always()
      && needs.plan.outputs.installer_iso == 'true'
      && (needs.kmods.result == 'success' || needs.kmods.result == 'skipped')
      && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
      && (needs.tool-images.result == 'success' || needs.tool-images.result == 'skipped')
    uses: ./.github/workflows/build-installer-iso.yml
    with:
      prepare_kernel_modules: false
      release_tag: ${{ needs.create-release.outputs.tag }}
      upload_actions_artifacts: ${{ needs.plan.outputs.upload_actions_artifacts == 'true' }}

  # Prebuilt lorax/kiwi/kmods images (7-day skip inside containers.yml).
  tool-images:
    needs: [plan, cleanup]
    if: |
      always()
      && needs.plan.outputs.need_tool_images == 'true'
      && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
    with:
      targets: ${{ needs.plan.outputs.tool_targets }}
      force: false
      force_canary: false
      run_canary_test: false

  # Canary lifecycle lives only in containers.yml (not inlined here).
  canary-containers:
    needs: [plan, cleanup]
    if: |
      always()
      && needs.plan.outputs.canary == 'true'
      && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
    with:
      targets: canary
      force: false
      # Schedule forces a fresh canary; manual canary=true reuses if <7 days.
      force_canary: ${{ needs.plan.outputs.force_canary == 'true' }}
      run_canary_test: true

  # No parent upload-* jobs. Each build job publishes when its product is
  # ready (release_tag + scripts/ci-upload-release-asset.sh).
  finalize:
    needs:
      - plan
      - create-release
      - build-live
      - build-installer
      - tool-images
      - canary-containers
      - kmods
    if: always()
    runs-on: ${{ vars.AZL_RUNNER_LIGHT || 'ubuntu-24.04' }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          NEED_REL: ${{ needs.plan.outputs.need_github_release }}
          WANT_LIVE: ${{ needs.plan.outputs.live_iso }}
          WANT_QCOW2: ${{ needs.plan.outputs.qcow2 }}
          WANT_VHDX: ${{ needs.plan.outputs.vhdx }}
          WANT_VDI: ${{ needs.plan.outputs.vdi }}
          WANT_VMDK: ${{ needs.plan.outputs.vmdk }}
          WANT_INSTALL: ${{ needs.plan.outputs.installer_iso }}
        run: |
          set -euo pipefail
          echo "kmods=${{ needs.kmods.result }}"
          echo "tool-images=${{ needs.tool-images.result }}"
          echo "canary-containers=${{ needs.canary-containers.result }}"
          echo "build-live=${{ needs.build-live.result }}"
          echo "build-installer=${{ needs.build-installer.result }}"
          if [ "$NEED_REL" != "true" ] || [ -z "${TAG:-}" ]; then
            echo "No GitHub Release tag in this run; skip asset notes."
            exit 0
          fi
          assets=$(gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name' || true)
          missing=""
          if [ "$WANT_LIVE" = "true" ]; then
            echo "$assets" | grep -q 'azurelinux-desktop-live\.iso\.split\.' || missing="$missing live-iso"
          fi
          if [ "$WANT_QCOW2" = "true" ]; then
            echo "$assets" | grep -q '\.qcow2\.split\.' || missing="$missing qcow2"
          fi
          if [ "$WANT_VHDX" = "true" ]; then
            echo "$assets" | grep -q '\.vhdx\.7z\.split\.' || missing="$missing vhdx"
          fi
          if [ "$WANT_VDI" = "true" ]; then
            echo "$assets" | grep -q '\.vdi\.7z\.split\.' || missing="$missing vdi"
          fi
          if [ "$WANT_VMDK" = "true" ]; then
            echo "$assets" | grep -q '\.vmdk\.7z\.split\.' || missing="$missing vmdk"
          fi
          if [ "$WANT_INSTALL" = "true" ]; then
            echo "$assets" | grep -q 'azurelinux-desktop-install\.iso\.split\.' || missing="$missing installer-iso"
          fi
          body=$(gh release view "$TAG" -R "${{ github.repository }}" --json body --jq '.body' || true)
          clean_body=$(printf '%s' "$body" | grep -v '^\*\*Note:\*\* the following artifact(s) did not make it into this release:' || true)
          if [ -n "$missing" ]; then
            note="**Note:** the following artifact(s) did not make it into this release:$missing."
            printf '%s\n\n%s\n' "$note" "$clean_body" | gh release edit "$TAG" -R "${{ github.repository }}" --notes-file -
          elif [ -n "$body" ] && [ "$clean_body" != "$body" ]; then
            printf '%s\n' "$clean_body" | gh release edit "$TAG" -R "${{ github.repository }}" --notes-file -
          fi
