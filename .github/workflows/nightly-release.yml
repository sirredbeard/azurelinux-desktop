name: Nightly release (all artifacts)

# One flat graph. No nested release wrappers.
#
#   cleanup → kmods (once) → parallel builds → parallel uploads → finalize
#                         ↘ canary (no kmods)
#
# Manual focused rebuilds use:
#   - release-live-iso.yml
#   - release-installer-iso.yml
#   - canary-container.yml
#   - publish-desktop-kmods.yml
on:
  schedule:
    - cron: "30 05 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: azurelinux-desktop-publication
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out all tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete previous GitHub releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "${{ github.repository }}" --limit 1000 \
            --json tagName --jq '.[].tagName' |
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              gh release delete "$tag" --repo "${{ github.repository }}" --yes
            done
          git ls-remote --tags --refs origin |
            awk '{sub("refs/tags/", "", $2); print $2}' |
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              git push origin --delete "refs/tags/$tag"
            done

  kmods:
    needs: cleanup
    uses: ./.github/workflows/publish-desktop-kmods.yml

  create-release:
    needs: cleanup
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Azure Linux Desktop ${{ steps.tag.outputs.tag }}
          body_path: .github/release-notes-template.md

  # One reusable call builds ISO + qcow2 + VHDX/VDI/VMDK in parallel jobs.
  build-live:
    needs: kmods
    uses: ./.github/workflows/build-live-iso.yml
    with:
      build_iso: true
      build_disk_image: true
      build_vhdx: true
      build_vdi: true
      build_vmdk: true
      prepare_kernel_modules: false

  build-installer:
    needs: kmods
    uses: ./.github/workflows/build-installer-iso.yml
    with:
      prepare_kernel_modules: false

  canary:
    needs: cleanup
    uses: ./.github/workflows/canary-container.yml

  upload-live-iso:
    needs: [create-release, build-live]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azurelinux-desktop-live-iso
          path: dist
      - working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=$(ls ./*.iso)
          sha256sum "$f" > "$f.sha256"
          split -b 1900M -d -a 2 --additional-suffix=.part "$f" "$f.split."
          rm -f "$f"
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "$f".split.*.part "$f.sha256" --clobber -R "${{ github.repository }}"

  upload-qcow2:
    needs: [create-release, build-live]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azurelinux-desktop-live-qcow2
          path: dist
      - working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=$(ls ./*.qcow2)
          sha256sum "$f" > "$f.sha256"
          split -b 1900M -d -a 2 --additional-suffix=.part "$f" "$f.split."
          rm -f "$f"
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "$f".split.*.part "$f.sha256" --clobber -R "${{ github.repository }}"

  upload-vhdx:
    needs: [create-release, build-live]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azurelinux-desktop-live-vhdx
          path: dist
      - working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=$(ls ./*.vhdx.7z)
          sha256sum "$f" > "$f.sha256"
          split -b 1900M -d -a 2 --additional-suffix=.part "$f" "$f.split."
          rm -f "$f"
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "$f".split.*.part "$f.sha256" --clobber -R "${{ github.repository }}"

  upload-vdi:
    needs: [create-release, build-live]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azurelinux-desktop-live-vdi
          path: dist
      - working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=$(ls ./*.vdi.7z)
          sha256sum "$f" > "$f.sha256"
          split -b 1900M -d -a 2 --additional-suffix=.part "$f" "$f.split."
          rm -f "$f"
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "$f".split.*.part "$f.sha256" --clobber -R "${{ github.repository }}"

  upload-vmdk:
    needs: [create-release, build-live]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azurelinux-desktop-live-vmdk
          path: dist
      - working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=$(ls ./*.vmdk.7z)
          sha256sum "$f" > "$f.sha256"
          split -b 1900M -d -a 2 --additional-suffix=.part "$f" "$f.split."
          rm -f "$f"
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "$f".split.*.part "$f.sha256" --clobber -R "${{ github.repository }}"

  upload-installer:
    needs: [create-release, build-installer]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azurelinux-desktop-install-iso
          path: dist
      - working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=$(ls ./*.iso)
          sha256sum "$f" > "$f.sha256"
          split -b 1900M -d -a 2 --additional-suffix=.part "$f" "$f.split."
          rm -f "$f"
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "$f".split.*.part "$f.sha256" --clobber -R "${{ github.repository }}"

  finalize:
    needs:
      - create-release
      - upload-live-iso
      - upload-qcow2
      - upload-vhdx
      - upload-vdi
      - upload-vmdk
      - upload-installer
      - canary
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.create-release.outputs.tag }}"
          assets=$(gh release view "$tag" -R "${{ github.repository }}" --json assets --jq '.assets[].name' || true)
          missing=""
          echo "$assets" | grep -q 'azurelinux-desktop-live\.iso\.split\.' || missing="$missing live-iso"
          echo "$assets" | grep -q '\.qcow2\.split\.' || missing="$missing qcow2"
          echo "$assets" | grep -q '\.vhdx\.7z\.split\.' || missing="$missing vhdx"
          echo "$assets" | grep -q '\.vdi\.7z\.split\.' || missing="$missing vdi"
          echo "$assets" | grep -q '\.vmdk\.7z\.split\.' || missing="$missing vmdk"
          echo "$assets" | grep -qiE 'install.*\.iso\.split\.|azurelinux-desktop-install' || missing="$missing installer-iso"
          body=$(gh release view "$tag" -R "${{ github.repository }}" --json body --jq '.body' || true)
          clean_body=$(printf '%s' "$body" | grep -v '^\*\*Note:\*\* the following artifact(s) did not make it into this release:' || true)
          if [ -n "$missing" ]; then
            note="**Note:** the following artifact(s) did not make it into this release:$missing."
            printf '%s\n\n%s\n' "$note" "$clean_body" | gh release edit "$tag" -R "${{ github.repository }}" --notes-file -
          elif [ -n "$body" ] && [ "$clean_body" != "$body" ]; then
            printf '%s\n' "$clean_body" | gh release edit "$tag" -R "${{ github.repository }}" --notes-file -
          fi
          echo "canary=${{ needs.canary.result }}"
          echo "live-iso=${{ needs.upload-live-iso.result }}"
          echo "qcow2=${{ needs.upload-qcow2.result }}"
          echo "vhdx=${{ needs.upload-vhdx.result }}"
          echo "vdi=${{ needs.upload-vdi.result }}"
          echo "vmdk=${{ needs.upload-vmdk.result }}"
          echo "installer=${{ needs.upload-installer.result }}"
