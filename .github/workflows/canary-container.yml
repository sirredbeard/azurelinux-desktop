name: Canary container

# One workflow for the package-policy canary: build, push to GHCR, test.
# Called by nightly-release.yml. Also runs every 3 days and on manual
# dispatch so upstream drift is caught without a full image rebuild.
#
# Not a desktop image. No systemd, no GNOME session. Mirrors Azure Linux
# container-base: tiny OCI proof that kickstart repo priority, vendor
# RPMs, side-loads (.NET 11 tarball, Copilot, edit), and Plymouth packages
# still resolve. See scripts/build-canary-container.sh and
# findings/canary-container.md.
on:
  workflow_dispatch: {}
  workflow_call: {}
  schedule:
    # Every 3 days at 06:15 UTC
    - cron: "15 6 */3 * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: azurelinux-desktop-canary
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build canary container
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-canary-container.sh "ghcr.io/${{ github.repository }}/canary:latest"

      - name: Tag with the run's UTC date
        run: |
          date_tag="$(date -u +%Y.%m.%d)"
          podman tag "ghcr.io/${{ github.repository }}/canary:latest" "ghcr.io/${{ github.repository }}/canary:$date_tag"
          echo "date_tag=$date_tag" >> "$GITHUB_ENV"

      - name: Push both tags
        run: |
          podman push "ghcr.io/${{ github.repository }}/canary:latest"
          podman push "ghcr.io/${{ github.repository }}/canary:${{ env.date_tag }}"

  test-published-container:
    needs: build-and-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull canary container
        run: podman pull "ghcr.io/${{ github.repository }}/canary:latest"

      - name: Run package and Flatpak canary suite
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-container-logs"
          podman run --rm \
            --user root \
            -v "$GITHUB_WORKSPACE/scripts/test-canary-container.sh:/usr/local/bin/test-canary-container:ro,Z" \
            -v "$GITHUB_WORKSPACE/test-container-logs:/logs:Z" \
            "ghcr.io/${{ github.repository }}/canary:latest" \
            /usr/local/bin/test-canary-container

      - name: Upload canary logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-container-logs
          path: test-container-logs
          retention-days: 7
          if-no-files-found: warn
