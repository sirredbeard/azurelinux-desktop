# Keep Plymouth up during first-boot SELinux relabel / disk grow.
# Stock ExecStart quits Plymouth and prints fixfiles to the console.
#
# Reboot path (nested QA 2026-08-04):
# - SuccessAction= only works in [Unit]. In [Service] systemd logs
#   "Unknown key 'SuccessAction' ... ignoring" and never reboots.
# - Stock unit has RemainAfterExit=yes. After a clean oneshot exit the
#   unit stays "active", so SuccessAction never runs even when placed
#   correctly. Force RemainAfterExit=no so a clean helper exit becomes
#   inactive and SuccessAction=reboot fires.
# - Helper must exit 0 and must not call systemctl reboot itself (that
#   SIGTERMs the oneshot mid-reboot and marks the unit failed).
[Unit]
SuccessAction=reboot

[Service]
ExecStart=
ExecStart=/usr/libexec/azurelinux-desktop/azl-first-boot-prepare
RemainAfterExit=no
StandardOutput=journal
StandardError=journal
TimeoutStartSec=infinity
