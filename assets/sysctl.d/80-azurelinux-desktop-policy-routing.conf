# Loosen reverse-path filtering so NetworkManager policy-routed
# connections (routing-rules / never-default routes, used by any
# connection profile that overrides the default route for part of its
# traffic) keep working on top of the base OS hardening defaults.
#
# azurelinux-release-common ships strict rp_filter (1) system-wide. A
# connection that installs its own default route plus a routing rule
# exempting its own control traffic needs the kernel to accept that
# control traffic back in on the physical interface it actually arrives
# on. Strict mode re-derives the expected return path using the same
# rule table with no mark set, gets the overlay interface instead, and
# drops the packet as spoofed ("martian source") even though nothing is
# wrong. Loose mode (2) still rejects genuinely unroutable sources, it
# just accepts a return path via any interface instead of demanding the
# exact one, which is what this kind of split-default routing needs.
#
# Filename sorts after azurelinux-release-common's
# 70-azurelinux-hardening.conf so these keys win.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
